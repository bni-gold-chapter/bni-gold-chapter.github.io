  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ff6a3d);transition:width .4s}
  .progtxt{font-size:11.5px;color:var(--mut);margin-top:5px}

  .sectitle b{display:block;font-size:15.5px}

  .row .narrow{flex:0 0 96px}
  .numbered{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px}
  .autorow{display:flex;gap:8px;align-items:stretch}
  .autorow input{flex:1;min-width:0}
  .autobtn{flex:0 0 auto;padding:12px 14px;font-size:14px;white-space:nowrap}
  .numbered .n{flex:0 0 26px;height:44px;display:flex;align-items:center;justify-content:center;
    color:var(--mut);font-size:13px;font-weight:800}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--panel2);

    font-weight:700;cursor:pointer;transition:.15s}

  .btn.primary{background:linear-gradient(180deg,#ff1a14,var(--accent));border-color:var(--accent);color:#fff}
  .btn.wide{width:100%}

  .btnrow{display:flex;gap:9px;flex-wrap:wrap}
  /* ── 照片 ── */

  .thumb{flex:0 0 104px;height:132px;border-radius:11px;border:1px dashed var(--line2);background:#080a0e;

  .empty{color:var(--mut);text-align:center;padding:44px 16px;line-height:1.9}
  .note{background:rgba(245,179,1,.08);border:1px solid rgba(245,179,1,.3);border-radius:10px;

  /* ── 底部列 ── */
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,16,21,.97);

  .slideview{position:fixed;inset:0;z-index:70;background:#0b0d11;overflow:auto;

  .slidebar{position:sticky;top:0;z-index:2;display:flex;gap:9px;padding:8px 0 12px;background:#0b0d11}
  .slidebar .btn{flex:1}
  .sheetwrap{overflow:hidden;margin:0 auto 12px;border-radius:6px;
    box-shadow:0 6px 22px rgba(0,0,0,.55)}
  .sheet{position:relative;width:1280px;height:720px;background:#fff;background-size:100% 100%;
    background-repeat:no-repeat;transform-origin:0 0;font-size:16px;overflow:hidden}
  .sbox{position:absolute;display:flex;flex-direction:column;overflow:hidden;color:#000;
    box-sizing:border-box;line-height:1.2;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
  .sbox div{width:100%}
  .sheet img.simg{position:absolute;object-fit:cover}
  @media print{
    body > *:not(.slideview){display:none !important}
    .slideview{position:static;inset:auto;padding:0;background:#fff;overflow:visible}
    .slidebar{display:none !important}
    .sheetwrap{margin:0;overflow:visible;border-radius:0;box-shadow:none}
    .sheet{transform:none !important;page-break-after:always;break-after:page}
    @page{size:13.333in 7.5in;margin:0}
  }
  /* ── 列印（匯出 PDF）── */
  @media print{
    body{background:#fff;color:#000}
    header,.bottombar,.sechead .caret,.prog,.progtxt,.btnrow,.note{display:none!important}
    main{padding:0;max-width:none}
    .sec{border:none;background:#fff;page-break-inside:avoid;margin-bottom:14px}
    .secbody{display:block!important;padding:0}
    .sechead{padding:8px 0;border-bottom:2px solid #e10600}
    .sectitle b{color:#000;font-size:15px}
    .sectitle span,.fld .hint{color:#555}
    .secno{background:#fff;color:#000;border-color:#000}
    .fld label{color:#000}

      border-radius:0;padding:3px 0;font-size:13px}
    textarea{min-height:0}
    .thumb{border:1px solid #bbb}
  }
</style>

function parseMap(txt, sep){
  const m = {};
  txt.split(/\s+/).forEach(t => {
    if(!t) return;
    if(sep){ const i = t.indexOf(sep); if(i > 0) m[t.slice(0,i)] = t.slice(i+1); }
    else { const k = t[0]; const v = t.slice(1); if(k && v) m[k] = v; }
  });
  return m;
}
const SURNAME = parseMap(SURNAME_TXT);
/* 音節群組 → 單字對照 */
const PY_ALL = (() => {
  const m = {};
  PY_GROUPS.split(/\s+/).forEach(t => {
    const i = t.indexOf(':');
    if(i > 0){ const v = t.slice(0, i); for(const c of t.slice(i + 1)) m[c] = v; }
  });
  return m;
})();
// 手工表排在後面，可以覆蓋全字表（護照慣用寫法、破音字、姓氏讀音）
const PINYIN  = Object.assign(PY_ALL, SURNAME, parseMap(PINYIN_TXT));
/* 產業表的值含空白，要用整行切 */
const INDUSTRY = (() => {
  const m = {};
  INDUSTRY_TXT.split(/\s(?=[^\s=]+=)/).forEach(t => {
    const i = t.indexOf('=');
    if(i > 0) m[t.slice(0,i).trim()] = t.slice(i+1).trim();
  });
  return m;
})();

/* 中文姓名 → 羅馬拼音（姓 + 名，名連字號）*/
function romanize(name){
  const chars = (name||'').trim().replace(/\s+/g,'').split('');
  if(!chars.length) return {text:'', missing:[]};
  const missing = [];
  const surname = SURNAME[chars[0]] || PINYIN[chars[0]];
  if(!surname) missing.push(chars[0]);
  const given = chars.slice(1).map(c => { const v = PINYIN[c]; if(!v) missing.push(c); return v || '?'; });
  const text = [surname || '?', given.join('-')].filter(Boolean).join(' ').trim();
  return {text, missing};
}
/* 產業中文 → 英文（先全詞，再找包含的關鍵字）*/
function industryEnOf(zh){
  zh = (zh||'').trim();
  if(!zh) return '';
  if(INDUSTRY[zh]) return INDUSTRY[zh];
  const hit = Object.keys(INDUSTRY)
    .filter(k => zh.includes(k) || k.includes(zh))
    .sort((a,b) => b.length - a.length)[0];
  return hit ? INDUSTRY[hit] : '';
}
function autoFill(kind, targetId, srcId){
  const src = (DATA[srcId] || '').trim();
  if(!src){ alert(kind === 'name' ? '請先填「姓名」' : '請先填「產業名稱」'); return; }
  if(kind === 'name'){
    const r = romanize(src);
    if(!r.text || r.text.includes('?')){
      alert('有些字不在對照表裡（' + r.missing.join('、') + '），請自己補上或直接手動輸入。');
    }
    DATA[targetId] = r.text.replace(/\?/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'').trim();
  }else{
    const en = industryEnOf(src);
    if(!en){ alert('對照表裡沒有「' + src + '」，請手動輸入英文名稱。'); return; }
    DATA[targetId] = en;
  }
  save(); renderForm();
}

function nowStr(){ const d=new Date();

function newKey(){
  const c='abcdefghijkmnpqrstuvwxyz23456789';
  const a=new Uint8Array(10);
  // 注意：getRandomValues 必須以 crypto 當 this 呼叫，拆出來單獨叫會 Illegal invocation
  if(window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
  else for(let i=0;i<10;i++) a[i]=Math.floor(Math.random()*256);
  let s=''; for(let i=0;i<10;i++) s+=c[a[i]%c.length];
  return s;
}

    s.fields.forEach(f=>ids.push(f.id));
  });
  return ids;
}
function filledCount(d){
  const ids=allFieldIds();
  let n=0; ids.forEach(i=>{ const v=d[i]; if(v && String(v).trim()) n++; });
  return {n, total:ids.length};
}

function initSync(){
  if(!window.firebase){ return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    SHARED = true;
    if(MKEY){
      dbRef = firebase.database().ref(NODE+'/'+MKEY);
      dbRef.on('value', s=>{
        const v = s.val();
        if(v){
          applyingRemote = true;
          DATA = v.data || {};
          META = { name:v.name||'', createdAt:v.createdAt, updatedAt:v.updatedAt, updatedBy:v.updatedBy };
          if(!document.activeElement || !document.activeElement.matches('input,textarea')) renderForm();
          else { updateProgress(); }
          applyingRemote = false;
        }
      }, err=>{ flag('連線失敗', true); });
    }
  }catch(e){ console.warn(e); }
}
function flag(msg, err){
  const t=$('savetag'); if(!t) return;
  t.textContent = err ? ('⚠ '+msg) : ('✓ '+msg);
  t.className = 'savetag on' + (err?' err':'');
  if(!err) setTimeout(()=>t.className='savetag', 1600);
}
function save(){
  if(applyingRemote) return;
  updateProgress();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    if(!SHARED || !dbRef) { flag('離線，改動未上傳', true); return; }
    const payload = {
      name: META.name || DATA.name || '',
      data: DATA,
      createdAt: META.createdAt || Date.now(),
      updatedAt: Date.now(),
      updatedBy: ADMIN ? '導師/幹部' : (DATA.name || '本人')
    };
    dbRef.set(payload).then(()=>flag('已儲存')).catch(()=>flag('儲存失敗', true));
  }, 700);
}

function sectionHTML(s, i, open){
  const ids = [];
  if(s.list) for(let k=1;k<=s.list.n;k++) ids.push(s.list.prefix+k);
  s.fields.forEach(f=>ids.push(f.id));
  const done = ids.length && ids.every(id => DATA[id] && String(DATA[id]).trim());

  let body = '';
  if(s.list){
    body += `<div class="fld"><label>${esc(s.list.label)}</label></div>`;
    for(let k=1;k<=s.list.n;k++){
      const id = s.list.prefix+k;

        <input type="text" data-f="${id}" value="${esc(DATA[id]||'')}" oninput="setF('${id}',this.value)"
          placeholder="${esc(s.list.ph)}"></div>`;

/* ── 連動填寫：填了 A 就順手把 B 也補上（B 已經有東西就不動）──
   生日→星座、姓名→英文名、產業→行業代表/產業英文名、公司→會員資料表的公司。
   都只是「先幫你填好」，使用者隨時可以自己改掉。 */
const ZODIAC = [[1,20,'水瓶'],[2,19,'雙魚'],[3,21,'牡羊'],[4,20,'金牛'],[5,21,'雙子'],
                [6,22,'巨蟹'],[7,23,'獅子'],[8,23,'處女'],[9,23,'天秤'],[10,24,'天蠍'],
                [11,23,'射手'],[12,22,'摩羯']];
function zodiacOf(txt){
  // 生日寫法很多：1985.03.26 / 1985-3-26 / 3月26日 / 03/26 —— 直接取數字，
  // 有三組就當「年月日」用後兩組，兩組就當「月日」。
  const n = String(txt||'').match(/\d+/g);
  if(!n || n.length < 2) return '';
  const mo = +(n.length >= 3 ? n[n.length-2] : n[0]);
  const d  = +(n.length >= 3 ? n[n.length-1] : n[1]);
  if(mo < 1 || mo > 12 || d < 1 || d > 31) return '';
  const row = ZODIAC[mo-1];
  return d >= row[1] ? row[2] : ZODIAC[(mo+10)%12][2];
}
const DERIVE = {
  b_birth:  [['b_zodiac', v => zodiacOf(v)]],
  name:     [['nameEn',   v => romanize(v).text.replace(/\?/g,'').replace(/-+/g,'-')
                                .replace(/^-|-$/g,'').trim()]],
  industry: [['rep',        v => v],
             ['industryEn', v => industryEnOf(v)]],
  company:  [['b_company',  v => v]],
  p_city:   [['b_addr',     v => v]],
};
function applyDerived(id, val){
  const rules = DERIVE[id];
  if(!rules || !String(val||'').trim()) return false;
  let changed = false;
  rules.forEach(([target, fn]) => {
    if(String(DATA[target]||'').trim()) return;      // 已經有內容就不覆蓋
    let out = '';
    try{ out = fn(val); }catch(e){ out = ''; }
    if(out && String(out).trim()){
      DATA[target] = String(out).trim();
      const el = document.querySelector(`[data-f="${target}"]`);
      if(el && el !== document.activeElement){ el.value = DATA[target]; if(el.tagName === 'TEXTAREA') grow(el); }
      changed = true;
    }
  });
  return changed;
}
function setF(id, val){
  DATA[id] = val;
  if(id === 'name') META.name = val;
  applyDerived(id, val);
  save();
  const el = $('sec-'+ (SECTIONS.find(s=>
    (s.list && id.startsWith(s.list.prefix)) || s.fields.some(f=>f.id===id))||{}).id);
  if(el){
    const s = SECTIONS.find(x=>'sec-'+x.id===el.id);
    const ids=[]; if(s.list) for(let k=1;k<=s.list.n;k++) ids.push(s.list.prefix+k);
    s.fields.forEach(f=>ids.push(f.id));
    el.classList.toggle('done', ids.length && ids.every(i=>DATA[i]&&String(DATA[i]).trim()));
  }
}
function grow(t){ t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }

}

/* ═══════════════ 照片：選擇 → 裁切 ═══════════════ */
let cropState = null;
function pickPhoto(fieldId, ratio){
  const inp = $('filepick');
  inp.value = '';
  inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => openCropper(rd.result, fieldId, ratio||3/4);
    rd.readAsDataURL(f);
  };
  inp.click();
}
function clearPhoto(id){ delete DATA[id]; save(); renderForm(); }

function openCropper(src, fieldId, ratio){
  const img = new Image();
  img.onload = () => {
    const box = document.createElement('div');
    box.className = 'modal';
    box.innerHTML = `<div class="cropwrap">
      <div class="cropstage${ratio===1?' sq':''}"><canvas id="cropCv"></canvas></div>
      <div class="croptip">用手指拖曳移動，下方滑桿可放大縮小</div>
      <input type="range" id="cropZoom" min="100" max="300" value="100">
      <div class="btnrow" style="margin-top:12px">
        <button class="btn" style="flex:1" onclick="closeCropper()">取消</button>
        <button class="btn primary" style="flex:2" onclick="applyCrop()">✓ 使用這張</button>
      </div></div>`;
    document.body.appendChild(box);
    const cv = $('cropCv');
    const W = 600, H = Math.round(600 / ratio);
    cv.width = W; cv.height = H;
    const base = Math.max(W/img.width, H/img.height);
    cropState = { img, cv, ctx:cv.getContext('2d'), W, H, ratio, fieldId,
                  scale:1, base, x:0, y:0, box };
    drawCrop();
    $('cropZoom').oninput = e => { cropState.scale = e.target.value/100; clampCrop(); drawCrop(); };
    let drag=null;
    const pt = ev => { const t = ev.touches ? ev.touches[0] : ev;
      const r = cv.getBoundingClientRect();
      return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) }; };
    const down = ev => { drag = pt(ev); ev.preventDefault(); };
    const move = ev => { if(!drag) return; const p = pt(ev);
      cropState.x += p.x-drag.x; cropState.y += p.y-drag.y; drag=p; clampCrop(); drawCrop(); ev.preventDefault(); };
    const up = () => drag=null;
    cv.addEventListener('touchstart',down,{passive:false});
    cv.addEventListener('touchmove',move,{passive:false});
    cv.addEventListener('touchend',up);
    cv.addEventListener('mousedown',down);
    window.addEventListener('mousemove',move);
    window.addEventListener('mouseup',up);
  };
  img.src = src;
}
function clampCrop(){
  const s = cropState; const sc = s.base*s.scale;
  const w = s.img.width*sc, h = s.img.height*sc;
  s.x = Math.min(0, Math.max(s.W-w, s.x));
  s.y = Math.min(0, Math.max(s.H-h, s.y));
  if(w < s.W) s.x = (s.W-w)/2;
  if(h < s.H) s.y = (s.H-h)/2;
}
function drawCrop(){
  const s = cropState; if(!s) return;
  const sc = s.base*s.scale;
  s.ctx.fillStyle = '#000'; s.ctx.fillRect(0,0,s.W,s.H);
  s.ctx.drawImage(s.img, s.x, s.y, s.img.width*sc, s.img.height*sc);
}
function closeCropper(){ if(cropState){ cropState.box.remove(); cropState=null; } }
function applyCrop(){
  const s = cropState; if(!s) return;
  DATA[s.fieldId] = s.cv.toDataURL('image/jpeg', 0.86);
  closeCropper(); save(); renderForm();
}

function runsHTML(para, vals){
  const align = {ctr:'center', r:'right', just:'justify'}[para.a] || 'left';
  // 投影片固定 1280x720 px（= 13.333x7.5 吋）。sz 是 1/100 pt，1pt = 4/3 px。
  // 字級乘上 --fs（自動縮放係數），內容太長時整個方框一起等比縮小。
  const px = sz => (sz / 100 * 4 / 3);
  const fs = v => `calc(var(--fs) * ${v.toFixed(2)}px)`;
  let maxsz = 1400;
  const inner = para.r.map(run => {
    const txt = String(run.t).replace(/\{\{(\w+)\}\}/g,
      (m, k) => (vals[k] !== undefined ? vals[k] : ''));
    if(run.sz > maxsz) maxsz = run.sz;
    const st = [`font-size:${fs(px(run.sz))}`];
    if(run.b) st.push('font-weight:700');
    if(run.c) st.push('color:#' + run.c);
    return `<span style="${st.join(';')}">${esc(txt).replace(/\n/g,'<br>')}</span>`;
  }).join('');
  const st = [`text-align:${align}`, `font-size:${fs(px(maxsz))}`];
  if(para.ls) st.push(`line-height:${para.ls}`);
  if(para.sb) st.push(`margin-top:${fs(px(para.sb))}`);
  // marL/indent 是 OOXML 的段落縮排；項目符號靠負的首行縮排做出懸掛效果
  if(para.ml)  st.push(`padding-left:${fs(para.ml / EMU)}`);
  if(para.ind) st.push(`text-indent:${fs(para.ind / EMU)}`);
  const bullet = para.bu && para.r.some(r => String(r.t).trim())
    ? `<span style="font-size:${fs(px(maxsz))}">${esc(para.bu)}\u2003</span>` : '';
  return `<div style="${st.join(';')}">` + (bullet + inner || '&nbsp;') + `</div>`;
}
function renderSlideView(){
  const S = SLIDES, vals = tokenValues(DATA);
  const pct = (v, tot) => (v / tot * 100).toFixed(3) + '%';
  const byslide = {};
  S.boxes.forEach(b => (byslide[b.slide] = byslide[b.slide] || []).push(b));
  const imgs = {};
  (S.imgs || []).forEach(i => (imgs[i.slide] = imgs[i.slide] || []).push(i));

  let html = `<div class="slidebar">
      <button class="btn" onclick="closeSlides()">✕ 關閉</button>
      <button class="btn primary" onclick="window.print()">🖨 儲存 PDF</button>
    </div>`;
  for(let n = 1; n <= S.slides; n++){
    const boxes = (byslide[n] || []).map(b => {
      const just = b.anchor === 'ctr' ? 'center' : (b.anchor === 'b' ? 'flex-end' : 'flex-start');
      const ins = b.ins || [91440, 45720, 91440, 45720];
      const pad = ins.map(v => (v / EMU).toFixed(2) + 'px');
      return `<div class="sbox" style="--fs:1;left:${pct(b.x,S.w)};top:${pct(b.y,S.h)};`
           + `width:${pct(b.w,S.w)};height:${pct(b.h,S.h)};justify-content:${just};`
           + `padding:${pad[1]} ${pad[2]} ${pad[3]} ${pad[0]}">`
           + b.p.map(p => runsHTML(p, vals)).join('') + `</div>`;
    }).join('');
    const pics = (imgs[n] || []).filter(i => DATA[i.id]).map(i =>
      `<img class="simg" src="${DATA[i.id]}" style="left:${pct(i.x,S.w)};top:${pct(i.y,S.h)};`
      + `width:${pct(i.w,S.w)};height:${pct(i.h,S.h)}">`).join('');
    html += `<div class="sheetwrap"><div class="sheet"
        style="background-image:url('slides/bg-${n}.png')">${boxes}${pics}</div></div>`;
  }
  $('slideview').innerHTML = html;
  fitSlides();
  shrinkBoxes();
  // 字型還沒載完時量到的高度不準，載完再算一次
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(shrinkBoxes);
}
/* 內容比方框高時自動縮小字級（等同 PowerPoint 的「文字自動壓縮」），
   不然長答案會壓過表格框線、或被裁掉看不到。 */
function shrinkBoxes(){
  document.querySelectorAll('#slideview .sbox').forEach(el => {
    el.style.setProperty('--fs', 1);
    if(el.scrollHeight <= el.clientHeight + 1) return;
    let lo = 0.4, hi = 1;
    for(let i = 0; i < 12; i++){
      const mid = (lo + hi) / 2;
      el.style.setProperty('--fs', mid);
      if(el.scrollHeight <= el.clientHeight + 1) lo = mid; else hi = mid;
    }
    el.style.setProperty('--fs', lo);
  });
}
function fitSlides(){
  const v = $('slideview'); if(!v || v.style.display === 'none') return;
  const avail = v.clientWidth - 24;
  const scale = Math.min(1, avail / 1280);
  v.querySelectorAll('.sheetwrap').forEach(w => {
    const sh = w.querySelector('.sheet');
    sh.style.transform = `scale(${scale})`;
    w.style.width = (1280 * scale) + 'px';
    w.style.height = (720 * scale) + 'px';
  });
}
window.addEventListener('resize', fitSlides);
async function openSlides(){
  const btns = document.querySelectorAll('.bottombar .btn');
  btns.forEach(b => b.disabled = true);
  const old = btns[0].textContent; btns[0].textContent = '準備中…';
  try{
    await loadSlides();
    $('slideview').style.display = 'block';
    renderSlideView();
    $('slideview').scrollTop = 0;
  }catch(e){ alert('無法開啟投影片檢視：' + (e.message || e)); }
  finally{ btns.forEach(b => b.disabled = false); btns[0].textContent = old; }
}
function closeSlides(){ $('slideview').style.display = 'none'; $('slideview').innerHTML = ''; }

/* ═══════════════ 把照片塞進 PPT ═══════════════ */
async function injectPics(zip, S){
  const slots = (S.imgs || []).filter(i => DATA[i.id]);
  for(let k = 0; k < slots.length; k++){
    const it = slots[k];
    const m = /^data:image\/(\w+);base64,(.+)$/.exec(DATA[it.id] || '');
    if(!m) continue;
    const ext = m[1] === 'jpg' ? 'jpeg' : m[1];
    const file = `bioimg${k + 1}.${ext}`;
    zip.file('ppt/media/' + file, m[2], {base64: true});
    const rid = 'rIdBio' + (k + 1);
    const relPath = `ppt/slides/_rels/slide${it.slide}.xml.rels`;
    let rels = await zip.file(relPath).async('string');
    rels = rels.replace('</Relationships>',
      `<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/`
      + `2006/relationships/image" Target="../media/${file}"/></Relationships>`);
    zip.file(relPath, rels);
    const sp = `ppt/slides/slide${it.slide}.xml`;
    let xml = await zip.file(sp).async('string');
    const pic = `<p:pic><p:nvPicPr><p:cNvPr id="${9100 + k}" name="${it.id}"/>`
      + `<p:cNvPicPr/><p:nvPr/></p:nvPicPr>`
      + `<p:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></p:blipFill>`
      + `<p:spPr><a:xfrm><a:off x="${it.x}" y="${it.y}"/><a:ext cx="${it.w}" cy="${it.h}"/></a:xfrm>`
      + `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>`;
    xml = xml.replace('</p:spTree>', pic + '</p:spTree>');
    zip.file(sp, xml);
  }
}

/* ═══════════════ 匯出 PPT（把資料填進原版模板）═══════════════ */
function tokenValues(d){
  const t = {};
  const g = k => (d[k] || '').trim();
  // 直接對應
  allFieldIds().forEach(id => { t[id] = g(id); });
  // 組合欄位（模板裡連標籤一起被 token 取代，這裡補回標籤）
  t.ch_zh         = '全鑫';          // 分會名（模板原為 XX白金分會）
  t.ch_en         = 'GOLD CHAPTER';
  t.cover_name    = g('name');
  t.cover_ind     = g('industry');
  t.cover_name_en = g('nameEn');
  t.cover_ind_en  = g('industryEn');
  t.s6_rep        = '行業代表：' + g('rep');
  t.s6_company    = '公司：' + g('company');
  t.s6_name       = g('name');
  t.s6_nameEn     = g('nameEn');
  t.s6_slogan     = g('slogan');
  t.s6_next       = '下一位：' + g('next');
  t.s7_slogan     = g('slogan');
  t.s7_next       = '下一位：' + g('next');
  t.b_nameline    = g('name') + '　　' + g('industry') + ' 代表';
  t.b_zodiac      = g('b_zodiac') ? g('b_zodiac') + '座' : '';
  t.b_editdate    = nowStr() + ' 編修';
  t.b_prev1y      = g('b_prev1y') ? g('b_prev1y') + '年' : '';
  t.b_prev2y      = g('b_prev2y') ? g('b_prev2y') + '年' : '';
  t.b_cury        = g('b_cury')   ? g('b_cury')   + '年' : '';
  t.p_years       = g('p_years')  ? g('p_years')  + '年' : '';
  t.gr_center     = g('name') + '\n' + (g('industry') || g('rep'));
  return t;
}
/* 把 {{token}} 換成文字；換行要拆成多個 run 加 <a:br/> */
function fillXml(xml, vals){
  return xml.replace(/<a:r>((?:(?!<a:r>)[\s\S])*?)<a:t>([^<]*?)\{\{(\w+)\}\}([^<]*?)<\/a:t>\s*<\/a:r>/g,
    (m, head, pre, key, post) => {
      const raw = (vals[key] !== undefined ? vals[key] : '');
      // 注意：不能寫成 /<a:rPr[\s\S]*?(?:\/>|<\/a:rPr>)/ ──
      // <a:rPr> 底下常有 <a:latin .../> 這類子元素，非貪婪比對會停在子元素的
      // 「/>」，切出一個沒有結尾的 <a:rPr>，接進 <a:br> 後整個 XML 就壞了。
      // LibreOffice 會自行修復所以看起來正常，PowerPoint 則會整頁內容不見。
      const rpr = (head.match(/<a:rPr(?:\s[^>]*)?\/>|<a:rPr(?:\s[^>]*)?>[\s\S]*?<\/a:rPr>/) || [''])[0];
      const lines = String(raw).split('\n');
      return lines.map((ln, i) => {
        const txt = (i===0 ? pre : '') + ln + (i===lines.length-1 ? post : '');
        return (i ? '<a:br>' + rpr + '</a:br>' : '') +
               '<a:r>' + head + '<a:t>' + esc(txt) + '</a:t></a:r>';
      }).join('');
    });
}
/* ── 匯出 PPT 時的「文字自動壓縮」──────────────────────────────
   原版模板的文字框是照範例的字數做的，換成別人比較長的公司名或 SLOGAN 就會
   滿出方框（在 PowerPoint 裡會壓到下一個區塊）。這裡先用畫布量出文字實際佔的
   高度，算出需要縮到幾成，寫進 <a:normAutofit fontScale>，PowerPoint 開檔就會
   照這個比例縮字。表格不用處理 —— PowerPoint 的表格列會自己長高。 */
/* 估算一段文字的寬度（單位：px）。
   不用 canvas 量 —— 瀏覽器裡沒有 PowerPoint 的字型，量出來的數字對不上，
   實測會低估而漏掉該縮的框。中日韓字一律算一個字寬，西文字母另外給係數。 */
function estWidth(txt, px){
  let em = 0;
  for(const ch of String(txt)){
    const c = ch.codePointAt(0);
    if(c > 0x2e80)                       em += 1;      // 中文、全形標點
    else if(ch === ' ')                  em += 0.28;
    else if(/[A-Z0-9@#%&]/.test(ch))     em += 0.62;
    else if(/[a-z]/.test(ch))            em += 0.53;
    else if(/[iljt.,:;'"|!\[\]()]/.test(ch)) em += 0.30;
    else                                 em += 0.50;
  }
  return em * px;
}
function boxScale(box, vals){
  const ins = box.ins || [91440, 45720, 91440, 45720];
  const W = (box.w - ins[0] - ins[2]) / EMU, H = (box.h - ins[1] - ins[3]) / EMU;
  if(W <= 4 || H <= 4) return 1;
  const fill = t => String(t).replace(/\{\{(\w+)\}\}/g,
    (m, k) => (vals[k] !== undefined ? vals[k] : ''));
  const height = sc => {
    let h = 0;
    box.p.forEach(p => {
      const sz = Math.max(1400, ...p.r.map(r => r.sz)) / 100 * 4 / 3 * sc;
      // 留 8% 餘裕：估算再準也會有誤差，寧可小一點也不要滿出來
      const avail = Math.max(20, (W - (p.ml || 0) / EMU * sc) * 0.92);
      const txt = (p.bu ? p.bu + '\u2003' : '') + p.r.map(r => fill(r.t)).join('');
      const lh = sz * (p.ls || 1.2);
      txt.split('\n').forEach(seg => {
        h += Math.max(1, Math.ceil(estWidth(seg, sz) / avail)) * lh;
      });
      h += (p.sb || 0) / 100 * 4 / 3 * sc;
    });
    return h;
  };
  if(height(1) <= H) return 1;
  let lo = 0.4, hi = 1;
  for(let i = 0; i < 10; i++){ const m = (lo + hi) / 2; if(height(m) <= H) lo = m; else hi = m; }
  return lo;
}
function setAutofit(sp, pct){
  const m = sp.match(/<a:bodyPr([^>]*?)(\/>|>)/);
  if(!m) return sp;
  const af = `<a:normAutofit fontScale="${pct}"/>`;
  const a = m.index, b = a + m[0].length;
  if(m[2] === '/>') return sp.slice(0, a) + `<a:bodyPr${m[1]}>${af}</a:bodyPr>` + sp.slice(b);
  const close = sp.indexOf('</a:bodyPr>', b);
  if(close < 0) return sp;
  const inner = sp.slice(b, close).replace(
    /<a:(?:normAutofit|noAutofit|spAutoFit)(?:\s[^>]*)?(?:\/>|>[\s\S]*?<\/a:\w+>)/g, '');
  return sp.slice(0, a) + `<a:bodyPr${m[1]}>` + af + inner + sp.slice(close);
}
/* token → 版面方框，用來查這個文字框該縮多少 */
function tokenBoxes(S){
  const map = {};
  (S.boxes || []).forEach(b => b.p.forEach(p => p.r.forEach(r =>
    String(r.t).replace(/\{\{(\w+)\}\}/g, (m, k) => { map[k] = b; return m; }))));
  return map;
}
function autofitXml(xml, vals, tokBox){
  return xml.replace(/<p:sp>[\s\S]*?<\/p:sp>/g, sp => {
    const m = sp.match(/\{\{(\w+)\}\}/);
    const box = m && tokBox[m[1]];
    if(!box) return sp;
    const sc = boxScale(box, vals);
    return sc >= 0.995 ? sp : setAutofit(sp, Math.round(sc * 100000));
  });
}

async function exportPPT(){
  const btns = document.querySelectorAll('.bottombar .btn');
  btns.forEach(b=>b.disabled=true);
  const old = btns[1].textContent; btns[1].textContent = '產生中…';
  try{
    if(typeof JSZip === 'undefined') throw new Error('元件尚未載入，請稍候再試');
    const res = await fetch(TPL);
    if(!res.ok) throw new Error('讀不到模板檔（' + res.status + '）');
    const zip = await JSZip.loadAsync(await res.arrayBuffer());
    const vals = tokenValues(DATA);
    const S = await loadSlides();
    const tokBox = tokenBoxes(S);
    const names = Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n));
    for(const n of names){
      const xml = await zip.file(n).async('string');
      zip.file(n, fillXml(autofitXml(xml, vals, tokBox), vals));
    }
    await injectPics(zip, S);
    const blob = await zip.generateAsync({type:'blob',
      mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
    const nm = (DATA.name || '四加一表').replace(/[\\/:*?"<>|]/g,'');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `BNI四加一表_${nm}_${nowStr().replace(/\./g,'')}.pptx`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  }catch(e){
    alert('匯出失敗：' + (e.message || e));
  }finally{
    btns.forEach(b=>b.disabled=false); btns[1].textContent = old;
  }
}

function tryPin(){
  if($('pin').value.trim() === COORD_PIN){
    ADMIN = true; localStorage.setItem('bio_admin','1'); loadAdmin();

function loadAdmin(){
  $('view').innerHTML = '<div class="empty">載入中…</div>';
  if(!SHARED){ $('view').innerHTML='<div class="empty">連線失敗，請重新整理。</div>'; return; }
  firebase.database().ref(NODE).on('value', s=>{ ALL = s.val() || {}; renderAdmin(); });
  firebase.database().ref(TRACKER+'/newMembers').once('value').then(s=>{
    window.__tracker = s.val() || []; renderAdmin();
  }).catch(()=>{});

function renderAdmin(){
  if(ALL === null) return;
  const base = location.origin + location.pathname;
  const rows = Object.entries(ALL).map(([k,v])=>{
    const d = v.data || {};
    const {n,total} = filledCount(d);
    const pct = Math.round(n/total*100);
    const cls = pct===100 ? 'ok' : (pct>0 ? 'mid' : 'no');
    const url = base + '?m=' + k;
    const upd = v.updatedAt ? new Date(v.updatedAt).toLocaleString('zh-TW',{hour12:false}) : '—';
    return `<div class="card">
      <div class="nm">${esc(v.name || d.name || '（未填姓名）')}
        <span class="pill ${cls}">${pct}%</span></div>
      <div class="meta">${esc(d.industry||d.rep||'')}　·　最後更新 ${esc(upd)}</div>
      <input class="linkbox" readonly value="${esc(url)}" onclick="this.select()">
      <div class="btnrow" style="margin-top:9px">
        <button class="btn" style="flex:1" onclick="copyTxt(this,'${url}')">複製連結</button>
        <button class="btn" style="flex:1" onclick="location.href='${url}'">開啟填寫</button>
      </div></div>`;
  }).join('');
  const seed = (window.__tracker||[]).filter(m=>
    !Object.values(ALL).some(v=>(v.name||'')===m.name));
  const seedHTML = seed.length ? `<div class="card">
      <div class="nm" style="font-size:15px">➕ 從追蹤名單建立</div>
      <div class="meta" style="margin-bottom:10px">點一下就會幫他建立一份空白四加一表並產生專屬連結</div>
      <div class="btnrow">${seed.map(m=>
        `<button class="btn" data-n="${esc(m.name)}" onclick="createFor(this.dataset.n)">${esc(m.name)}</button>`).join('')}</div>
    </div>` : '';
  $('view').innerHTML =
    `<div class="note">把每個人的<b>專屬連結</b>私訊給他本人，他點開就能直接填、自動儲存。</div>` +
    seedHTML +
    (rows || `<div class="empty">還沒有任何四加一表。<br>可以從上面的追蹤名單建立。</div>`) +
    `<div class="card"><div class="nm" style="font-size:15px">➕ 手動新增</div>
      <input type="text" id="newName" class="linkbox" style="color:#fff;font-size:16px;padding:12px;margin-top:9px"
        placeholder="輸入姓名">
      <button class="btn wide" style="margin-top:9px" onclick="createFor($('newName').value)">建立</button></div>`;
}
function createFor(name){
  name = (name||'').trim();
  if(!name){ alert('請輸入姓名'); return; }
  if(!SHARED){ alert('雲端未連線，請重新整理後再試。'); return; }
  try{
    const k = newKey();
    firebase.database().ref(NODE+'/'+k).set({
      name, data:{ name }, createdAt:Date.now(), updatedAt:Date.now(), updatedBy:'導師/幹部'
    }).then(()=>{
      const el = $('newName'); if(el) el.value='';
    }).catch(e=>alert('建立失敗：'+(e.message||e)));
  }catch(e){ alert('建立失敗：'+(e.message||e)); }
}
function copyTxt(btn, txt){
  navigator.clipboard.writeText(txt).then(()=>{
    const o = btn.textContent; btn.textContent = '已複製 ✓';
    setTimeout(()=>btn.textContent = o, 1500);
  });
}
