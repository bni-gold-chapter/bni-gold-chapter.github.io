name: 更新紅綠燈數據 (refdata)

# 2026/10/08 起平常不需要：紅綠燈由分會中樞（bnigoldchaptertc/bnigoldchaptertc 的 Apps Script）自動同步到 refdata。
# 這個 workflow 只留作中樞故障時的手動補救（需要 secret DASHBOARD_KEY），已拿掉每週排程 ——
# 以前每週日抓的舊紅綠燈檢視表停在 2026/09/24，再跑只會把新數據蓋回舊的。
on:
  workflow_dispatch:
    inputs:
      force:
        description: '強制寫入（即使數據無變化）'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取紅綠燈檢視表 → 寫入 Firebase refdata
        run: node update-refdata.js
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
          # 管理網站「紅綠燈儀表板」的金鑰（LINE 領導團隊群組輸入「儀表板」拿到的連結裡 ?k= 後面那串）。
          # 放在 repo Settings → Secrets and variables → Actions，名稱 DASHBOARD_KEY。公開 repo，絕不寫進檔案。
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
