name: 驗證 Firebase 規則是否生效

# 在主控台貼上 firebase-rules.json 並發布之後跑這個。
# 只讀不刪，不碰任何真實資料節點；唯一的寫入是往 /_ruletest 丟一個數字，
# 規則正確時會被擋下來，什麼都不會留下。
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 驗證
        run: node verify-rules.js
