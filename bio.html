    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    padding-bottom:env(safe-area-inset-bottom)}
  /* ── 頁首 ── */

    border-bottom:2px solid var(--accent);padding:12px 16px calc(12px + env(safe-area-inset-top)) 16px;
    padding-top:calc(12px + env(safe-area-inset-top))}
  .htop{display:flex;align-items:center;gap:10px}
  h1{margin:0;font-size:17px;font-weight:900;letter-spacing:.5px}
  h1 small{display:block;font-size:11px;font-weight:400;color:var(--mut);letter-spacing:2px;margin-top:2px}
  .who{margin-left:auto;text-align:right;font-size:12px;color:var(--mut);line-height:1.4}
  .who b{color:#fff;font-size:14px;display:block}
  .savetag{font-size:12px;color:var(--green);opacity:0;transition:.25s;white-space:nowrap}
  .savetag.on{opacity:1}
  .savetag.err{color:var(--accent);opacity:1}
  /* ── 進度 ── */
  .prog{height:5px;background:#000;border-radius:3px;overflow:hidden;margin-top:10px}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ff6a3d);transition:width .4s}
  .progtxt{font-size:11.5px;color:var(--mut);margin-top:5px}
  /* ── 章節 ── */
  main{padding:14px 14px 120px;max-width:820px;margin:0 auto}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .sechead{display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer;user-select:none}
  .sechead:active{background:var(--panel2)}
  .secno{flex:0 0 30px;height:30px;border-radius:50%;background:#0a0d13;border:1px solid var(--line2);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#aab4c2}
  .sec.done .secno{background:rgba(40,209,124,.15);border-color:var(--green);color:var(--green)}
  .sectitle{flex:1;min-width:0}
  .sectitle b{display:block;font-size:15.5px}
  .sectitle span{font-size:11.5px;color:var(--mut)}
  .caret{color:var(--mut);font-size:13px;transition:transform .2s}
  .sec.open .caret{transform:rotate(90deg)}
  .secbody{display:none;padding:0 16px 16px}
  .sec.open .secbody{display:block}
  /* ── 欄位 ── */
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
  .fld .hint{font-size:12px;color:var(--mut);font-weight:400;margin-top:2px}
  input[type=text],textarea,select{width:100%;background:#080a0e;border:1px solid var(--line);border-radius:10px;
    color:var(--txt);padding:12px 13px;font-size:16px;font-family:inherit;line-height:1.5}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,6,0,.15)}
  textarea{resize:none;overflow:hidden;min-height:52px}
  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}
  .row .narrow{flex:0 0 96px}
  .numbered{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px}
  .autorow{display:flex;gap:8px;align-items:stretch}
  .autorow input{flex:1;min-width:0}
  .autobtn{flex:0 0 auto;padding:12px 14px;font-size:14px;white-space:nowrap}
  .numbered .n{flex:0 0 26px;height:44px;display:flex;align-items:center;justify-content:center;
    color:var(--mut);font-size:13px;font-weight:800}
  /* ── 按鈕 ── */
  button{font-family:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--panel2);
    color:var(--txt);border:1px solid var(--line2);border-radius:11px;padding:13px 16px;font-size:15px;
    font-weight:700;cursor:pointer;transition:.15s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(180deg,#ff1a14,var(--accent));border-color:var(--accent);color:#fff}
  .btn.wide{width:100%}
  .btn:disabled{opacity:.5}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap}
  /* ── 照片 ── */
  .photobox{display:flex;gap:13px;align-items:flex-start}
  .thumb{flex:0 0 104px;height:132px;border-radius:11px;border:1px dashed var(--line2);background:#080a0e;
    display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;text-align:center;
    overflow:hidden;cursor:pointer}
  .thumb.sq{height:104px}
  .thumb img{width:100%;height:100%;object-fit:cover}
  /* ── 裁切器 ── */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:60;display:flex;align-items:center;
    justify-content:center;padding:16px}
  .cropwrap{width:100%;max-width:420px}
  .cropstage{position:relative;width:100%;aspect-ratio:3/4;background:#000;border-radius:12px;overflow:hidden;
    touch-action:none;border:1px solid var(--line2)}
  .cropstage.sq{aspect-ratio:1/1}
  .cropstage canvas{width:100%;height:100%;display:block}
  .cropstage::after{content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 2px rgba(225,6,0,.75)}
  .croptip{color:var(--mut);font-size:13px;text-align:center;margin:11px 0}
  input[type=range]{width:100%;accent-color:var(--accent);height:34px}
  /* ── 管理端 ── */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:11px}
  .card .nm{font-size:17px;font-weight:900}
  .card .meta{font-size:12.5px;color:var(--mut);margin-top:3px}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;margin-left:7px;vertical-align:middle}
  .pill.ok{background:rgba(40,209,124,.15);color:#7df3b4;border:1px solid var(--green)}
  .pill.mid{background:rgba(245,179,1,.13);color:#ffdf85;border:1px solid var(--yellow)}
  .pill.no{background:#161b22;color:#9aa6b5;border:1px solid var(--line2)}
  .linkbox{width:100%;background:#080a0e;border:1px solid var(--line);border-radius:9px;color:#8fc6ff;
    padding:9px 11px;font-size:12.5px;margin-top:9px}
  .empty{color:var(--mut);text-align:center;padding:44px 16px;line-height:1.9}
  .note{background:rgba(245,179,1,.08);border:1px solid rgba(245,179,1,.3);border-radius:10px;
    padding:11px 13px;font-size:13px;color:#ffdf85;margin-bottom:13px}
  /* ── 底部列 ── */
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,16,21,.97);
    border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:9px;max-width:820px;margin:0 auto}
  .bottombar .btn{flex:1;padding:14px 10px;font-size:15px}
  /* ── 列印（匯出 PDF）── */
  @media print{
    body{background:#fff;color:#000}
    header,.bottombar,.sechead .caret,.prog,.progtxt,.btnrow,.note{display:none!important}
    main{padding:0;max-width:none}
    .sec{border:none;background:#fff;page-break-inside:avoid;margin-bottom:14px}
    .secbody{display:block!important;padding:0}
    .sechead{padding:8px 0;border-bottom:2px solid #e10600}
    .sectitle b{color:#000;font-size:15px}
    .sectitle span,.fld .hint{color:#555}
    .secno{background:#fff;color:#000;border-color:#000}
    .fld label{color:#000}
    input[type=text],textarea,select{background:#fff;color:#000;border:none;border-bottom:1px solid #bbb;
      border-radius:0;padding:3px 0;font-size:13px}
    textarea{min-height:0}
    .thumb{border:1px solid #bbb}
  }
</style>

function parseMap(txt, sep){
  const m = {};
  txt.split(/\s+/).forEach(t => {
    if(!t) return;
    if(sep){ const i = t.indexOf(sep); if(i > 0) m[t.slice(0,i)] = t.slice(i+1); }
    else { const k = t[0]; const v = t.slice(1); if(k && v) m[k] = v; }
  });
  return m;
}
const SURNAME = parseMap(SURNAME_TXT);
const PINYIN  = Object.assign({}, SURNAME, parseMap(PINYIN_TXT));
/* 產業表的值含空白，要用整行切 */
const INDUSTRY = (() => {
  const m = {};
  INDUSTRY_TXT.split(/\s(?=[^\s=]+=)/).forEach(t => {
    const i = t.indexOf('=');
    if(i > 0) m[t.slice(0,i).trim()] = t.slice(i+1).trim();
  });
  return m;
})();

/* 中文姓名 → 羅馬拼音（姓 + 名，名連字號）*/
function romanize(name){
  const chars = (name||'').trim().replace(/\s+/g,'').split('');
  if(!chars.length) return {text:'', missing:[]};
  const missing = [];
  const surname = SURNAME[chars[0]] || PINYIN[chars[0]];
  if(!surname) missing.push(chars[0]);
  const given = chars.slice(1).map(c => { const v = PINYIN[c]; if(!v) missing.push(c); return v || '?'; });
  const text = [surname || '?', given.join('-')].filter(Boolean).join(' ').trim();
  return {text, missing};
}
/* 產業中文 → 英文（先全詞，再找包含的關鍵字）*/
function industryEnOf(zh){
  zh = (zh||'').trim();
  if(!zh) return '';
  if(INDUSTRY[zh]) return INDUSTRY[zh];
  const hit = Object.keys(INDUSTRY)
    .filter(k => zh.includes(k) || k.includes(zh))
    .sort((a,b) => b.length - a.length)[0];
  return hit ? INDUSTRY[hit] : '';
}
function autoFill(kind, targetId, srcId){
  const src = (DATA[srcId] || '').trim();
  if(!src){ alert(kind === 'name' ? '請先填「姓名」' : '請先填「產業名稱」'); return; }
  if(kind === 'name'){
    const r = romanize(src);
    if(!r.text || r.text.includes('?')){
      alert('有些字不在對照表裡（' + r.missing.join('、') + '），請自己補上或直接手動輸入。');
    }
    DATA[targetId] = r.text.replace(/\?/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'').trim();
  }else{
    const en = industryEnOf(src);
    if(!en){ alert('對照表裡沒有「' + src + '」，請手動輸入英文名稱。'); return; }
    DATA[targetId] = en;
  }
  save(); renderForm();
}

function pad2(n){ return String(n).padStart(2,'0'); }
function nowStr(){ const d=new Date();
  return d.getFullYear()+'.'+pad2(d.getMonth()+1)+'.'+pad2(d.getDate()); }
function newKey(){
  const c='abcdefghijkmnpqrstuvwxyz23456789';
  const a=new Uint8Array(10);
  // 注意：getRandomValues 必須以 crypto 當 this 呼叫，拆出來單獨叫會 Illegal invocation
  if(window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
  else for(let i=0;i<10;i++) a[i]=Math.floor(Math.random()*256);
  let s=''; for(let i=0;i<10;i++) s+=c[a[i]%c.length];
  return s;
}
/* 這份表的所有欄位 id（含清單欄位） */
function allFieldIds(){
  const ids=[];
  SECTIONS.forEach(s=>{
    if(s.list) for(let i=1;i<=s.list.n;i++) ids.push(s.list.prefix+i);
    s.fields.forEach(f=>ids.push(f.id));
  });
  return ids;
}
function filledCount(d){
  const ids=allFieldIds();
  let n=0; ids.forEach(i=>{ const v=d[i]; if(v && String(v).trim()) n++; });
  return {n, total:ids.length};
}

/* ═══════════════ Firebase ═══════════════ */
function initSync(){
  if(!window.firebase){ return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    SHARED = true;
    if(MKEY){
      dbRef = firebase.database().ref(NODE+'/'+MKEY);
      dbRef.on('value', s=>{
        const v = s.val();
        if(v){
          applyingRemote = true;
          DATA = v.data || {};
          META = { name:v.name||'', createdAt:v.createdAt, updatedAt:v.updatedAt, updatedBy:v.updatedBy };
          if(!document.activeElement || !document.activeElement.matches('input,textarea')) renderForm();
          else { updateProgress(); }
          applyingRemote = false;
        }
      }, err=>{ flag('連線失敗', true); });
    }
  }catch(e){ console.warn(e); }
}
function flag(msg, err){
  const t=$('savetag'); if(!t) return;
  t.textContent = err ? ('⚠ '+msg) : ('✓ '+msg);
  t.className = 'savetag on' + (err?' err':'');
  if(!err) setTimeout(()=>t.className='savetag', 1600);
}
function save(){
  if(applyingRemote) return;
  updateProgress();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    if(!SHARED || !dbRef) { flag('離線，改動未上傳', true); return; }
    const payload = {
      name: META.name || DATA.name || '',
      data: DATA,
      createdAt: META.createdAt || Date.now(),
      updatedAt: Date.now(),
      updatedBy: ADMIN ? '導師/幹部' : (DATA.name || '本人')
    };
    dbRef.set(payload).then(()=>flag('已儲存')).catch(()=>flag('儲存失敗', true));
  }, 700);
}

function fieldHTML(f){
  const v = esc(DATA[f.id] || '');
  const hint = f.hint ? `<div class="hint">${esc(f.hint)}</div>` : '';
  if(f.type === 'photo'){
    const img = DATA[f.id]
      ? `<img src="${DATA[f.id]}" alt="">`
      : '點這裡<br>上傳照片';
    return `<div class="fld">
      <label>${esc(f.label)}${hint}</label>
      <div class="photobox">
        <div class="thumb${f.ratio===1?' sq':''}" onclick="pickPhoto('${f.id}',${f.ratio})">${img}</div>
        <div style="flex:1">
          <button class="btn wide" onclick="pickPhoto('${f.id}',${f.ratio})">📷 ${DATA[f.id]?'換一張':'選擇照片'}</button>
          ${DATA[f.id]?`<button class="btn wide" style="margin-top:8px" onclick="clearPhoto('${f.id}')">移除</button>`:''}
        </div>
      </div></div>`;
  }
  const cls = f.narrow ? 'narrow' : '';
  if(f.auto){
    return `<div class="fld"><label>${esc(f.label)}${hint}</label>
      <div class="autorow">
        <input type="text" value="${v}" oninput="setF('${f.id}',this.value)" placeholder="${esc(f.ph||'')}">
        <button class="btn autobtn" onclick="autoFill('${f.auto.kind}','${f.id}','${f.auto.from}')">✨ 自動</button>
      </div></div>`;
  }
  if(f.type === 'area'){
    return `<div class="fld"><label>${esc(f.label)}${hint}</label>
      <textarea rows="2" oninput="setF('${f.id}',this.value);grow(this)"
        placeholder="${esc(f.ph||'')}">${v}</textarea></div>`;
  }
  return `<div class="fld ${cls}"><label>${esc(f.label)}${hint}</label>
    <input type="text" value="${v}" oninput="setF('${f.id}',this.value)" placeholder="${esc(f.ph||'')}"></div>`;
}
function sectionHTML(s, i, open){
  const ids = [];
  if(s.list) for(let k=1;k<=s.list.n;k++) ids.push(s.list.prefix+k);
  s.fields.forEach(f=>ids.push(f.id));
  const done = ids.length && ids.every(id => DATA[id] && String(DATA[id]).trim());
  const some = ids.some(id => DATA[id] && String(DATA[id]).trim());
  let body = '';
  if(s.list){
    body += `<div class="fld"><label>${esc(s.list.label)}</label></div>`;
    for(let k=1;k<=s.list.n;k++){
      const id = s.list.prefix+k;
      body += `<div class="numbered"><div class="n">${k}</div>
        <input type="text" value="${esc(DATA[id]||'')}" oninput="setF('${id}',this.value)"
          placeholder="${esc(s.list.ph)}"></div>`;
    }
  }
  body += s.fields.map(fieldHTML).join('');
  return `<section class="sec ${open?'open':''} ${done?'done':''}" id="sec-${s.id}">
    <div class="sechead" onclick="toggleSec('${s.id}')">
      <div class="secno">${done?'✓':(some?'·':i+1)}</div>
      <div class="sectitle"><b>${esc(s.title)}</b><span>${esc(s.sub)}</span></div>
      <div class="caret">▶</div>
    </div>
    <div class="secbody">${body}</div>
  </section>`;
}
function renderForm(){
  $('whoName').textContent = META.name || DATA.name || '';
  $('bottombar').style.display = 'flex';
  $('progWrap').style.display = '';
  const openId = window.__open || SECTIONS[0].id;
  $('view').innerHTML =
    `<div class="note">填完會<b>自動儲存</b>，隨時可以關掉、之後再從同一個連結回來繼續。</div>` +
    SECTIONS.map((s,i)=>sectionHTML(s,i,s.id===openId)).join('') +
    `<div style="height:8px"></div>`;
  document.querySelectorAll('textarea').forEach(grow);
  updateProgress();
}
function toggleSec(id){
  const el = $('sec-'+id);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('open'));
  if(!wasOpen){ el.classList.add('open'); window.__open = id;
    setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}), 60); }
  else window.__open = null;
}
function setF(id, val){
  DATA[id] = val;
  if(id === 'name') META.name = val;
  save();
  const el = $('sec-'+ (SECTIONS.find(s=>
    (s.list && id.startsWith(s.list.prefix)) || s.fields.some(f=>f.id===id))||{}).id);
  if(el){
    const s = SECTIONS.find(x=>'sec-'+x.id===el.id);
    const ids=[]; if(s.list) for(let k=1;k<=s.list.n;k++) ids.push(s.list.prefix+k);
    s.fields.forEach(f=>ids.push(f.id));
    el.classList.toggle('done', ids.length && ids.every(i=>DATA[i]&&String(DATA[i]).trim()));
  }
}
function grow(t){ t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }
function updateProgress(){
  const {n,total} = filledCount(DATA);
  const pct = Math.round(n/total*100);
  if($('progBar')) $('progBar').style.width = pct+'%';
  if($('progTxt')) $('progTxt').textContent = `完成 ${n} / ${total} 項（${pct}%）`;
}

let cropState = null;
function pickPhoto(fieldId, ratio){
  const inp = $('filepick');
  inp.value = '';
  inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => openCropper(rd.result, fieldId, ratio||3/4);
    rd.readAsDataURL(f);
  };
  inp.click();
}
function clearPhoto(id){ delete DATA[id]; save(); renderForm(); }

function openCropper(src, fieldId, ratio){
  const img = new Image();
  img.onload = () => {
    const box = document.createElement('div');
    box.className = 'modal';
    box.innerHTML = `<div class="cropwrap">
      <div class="cropstage${ratio===1?' sq':''}"><canvas id="cropCv"></canvas></div>
      <div class="croptip">用手指拖曳移動，下方滑桿可放大縮小</div>
      <input type="range" id="cropZoom" min="100" max="300" value="100">
      <div class="btnrow" style="margin-top:12px">
        <button class="btn" style="flex:1" onclick="closeCropper()">取消</button>
        <button class="btn primary" style="flex:2" onclick="applyCrop()">✓ 使用這張</button>
      </div></div>`;
    document.body.appendChild(box);
    const cv = $('cropCv');
    const W = 600, H = Math.round(600 / ratio);
    cv.width = W; cv.height = H;
    const base = Math.max(W/img.width, H/img.height);
    cropState = { img, cv, ctx:cv.getContext('2d'), W, H, ratio, fieldId,
                  scale:1, base, x:0, y:0, box };
    drawCrop();
    $('cropZoom').oninput = e => { cropState.scale = e.target.value/100; clampCrop(); drawCrop(); };
    let drag=null;
    const pt = ev => { const t = ev.touches ? ev.touches[0] : ev;
      const r = cv.getBoundingClientRect();
      return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) }; };
    const down = ev => { drag = pt(ev); ev.preventDefault(); };
    const move = ev => { if(!drag) return; const p = pt(ev);
      cropState.x += p.x-drag.x; cropState.y += p.y-drag.y; drag=p; clampCrop(); drawCrop(); ev.preventDefault(); };
    const up = () => drag=null;
    cv.addEventListener('touchstart',down,{passive:false});
    cv.addEventListener('touchmove',move,{passive:false});
    cv.addEventListener('touchend',up);
    cv.addEventListener('mousedown',down);
    window.addEventListener('mousemove',move);
    window.addEventListener('mouseup',up);
  };
  img.src = src;
}
function clampCrop(){
  const s = cropState; const sc = s.base*s.scale;
  const w = s.img.width*sc, h = s.img.height*sc;
  s.x = Math.min(0, Math.max(s.W-w, s.x));
  s.y = Math.min(0, Math.max(s.H-h, s.y));
  if(w < s.W) s.x = (s.W-w)/2;
  if(h < s.H) s.y = (s.H-h)/2;
}
function drawCrop(){
  const s = cropState; if(!s) return;
  const sc = s.base*s.scale;
  s.ctx.fillStyle = '#000'; s.ctx.fillRect(0,0,s.W,s.H);
  s.ctx.drawImage(s.img, s.x, s.y, s.img.width*sc, s.img.height*sc);
}
function closeCropper(){ if(cropState){ cropState.box.remove(); cropState=null; } }
function applyCrop(){
  const s = cropState; if(!s) return;
  DATA[s.fieldId] = s.cv.toDataURL('image/jpeg', 0.86);
  closeCropper(); save(); renderForm();
}

/* ═══════════════ 匯出 PPT（把資料填進原版模板）═══════════════ */
function tokenValues(d){
  const t = {};
  const g = k => (d[k] || '').trim();
  // 直接對應
  allFieldIds().forEach(id => { t[id] = g(id); });
  // 組合欄位（模板裡連標籤一起被 token 取代，這裡補回標籤）
  t.ch_zh         = '全鑫';          // 分會名（模板原為 XX白金分會）
  t.ch_en         = 'GOLD CHAPTER';
  t.cover_name    = g('name');
  t.cover_ind     = g('industry');
  t.cover_name_en = g('nameEn');
  t.cover_ind_en  = g('industryEn');
  t.s6_rep        = '行業代表：' + g('rep');
  t.s6_company    = '公司：' + g('company');
  t.s6_nameline   = g('name') + '\n' + g('nameEn');
  t.s6_slogan     = g('slogan');
  t.s6_next       = '下一位：' + g('next');
  t.s7_slogan     = g('slogan');
  t.s7_next       = '下一位：' + g('next');
  t.b_nameline    = g('name') + '　　' + g('industry') + ' 代表';
  t.b_zodiac      = g('b_zodiac') ? g('b_zodiac') + '座' : '';
  t.b_editdate    = nowStr() + ' 編修';
  t.b_prev1y      = g('b_prev1y') ? g('b_prev1y') + '年' : '';
  t.b_prev2y      = g('b_prev2y') ? g('b_prev2y') + '年' : '';
  t.b_cury        = g('b_cury')   ? g('b_cury')   + '年' : '';
  t.p_years       = g('p_years')  ? g('p_years')  + '年' : '';
  t.gr_center     = g('name') + '\n' + (g('industry') || g('rep'));
  return t;
}
/* 把 {{token}} 換成文字；換行要拆成多個 run 加 <a:br/> */
function fillXml(xml, vals){
  return xml.replace(/<a:r>((?:(?!<a:r>)[\s\S])*?)<a:t>([^<]*?)\{\{(\w+)\}\}([^<]*?)<\/a:t>\s*<\/a:r>/g,
    (m, head, pre, key, post) => {
      const raw = (vals[key] !== undefined ? vals[key] : '');
      const rpr = (head.match(/<a:rPr[\s\S]*?(?:\/>|<\/a:rPr>)/) || [''])[0];
      const lines = String(raw).split('\n');
      return lines.map((ln, i) => {
        const txt = (i===0 ? pre : '') + ln + (i===lines.length-1 ? post : '');
        return (i ? '<a:br>' + rpr + '</a:br>' : '') +
               '<a:r>' + head + '<a:t>' + esc(txt) + '</a:t></a:r>';
      }).join('');
    });
}
async function exportPPT(){
  const btns = document.querySelectorAll('.bottombar .btn');
  btns.forEach(b=>b.disabled=true);
  const old = btns[1].textContent; btns[1].textContent = '產生中…';
  try{
    if(typeof JSZip === 'undefined') throw new Error('元件尚未載入，請稍候再試');
    const res = await fetch(TPL);
    if(!res.ok) throw new Error('讀不到模板檔（' + res.status + '）');
    const zip = await JSZip.loadAsync(await res.arrayBuffer());
    const vals = tokenValues(DATA);
    const names = Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n));
    for(const n of names){
      const xml = await zip.file(n).async('string');
      zip.file(n, fillXml(xml, vals));
    }
    const blob = await zip.generateAsync({type:'blob',
      mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
    const nm = (DATA.name || '四加一表').replace(/[\\/:*?"<>|]/g,'');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `BNI四加一表_${nm}_${nowStr().replace(/\./g,'')}.pptx`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  }catch(e){
    alert('匯出失敗：' + (e.message || e));
  }finally{
    btns.forEach(b=>b.disabled=false); btns[1].textContent = old;
  }
}

/* ═══════════════ 導師／領導團隊：總覽 ═══════════════ */
function renderAdminGate(){
  $('progWrap').style.display='none';
  $('bottombar').style.display='none';
  $('whoName').textContent = '導師 / 領導團隊';
  $('view').innerHTML = `<div class="card">
    <div class="nm">四加一表 · 管理</div>
    <div class="meta" style="margin-bottom:13px">導師與領導團隊可以查看所有新會員的四加一表、產生填寫連結。</div>
    <input type="password" id="pin" class="linkbox" style="color:#fff;font-size:16px;padding:12px"
      placeholder="請輸入密碼" onkeydown="if(event.key==='Enter')tryPin()">
    <button class="btn primary wide" style="margin-top:11px" onclick="tryPin()">進入</button>
  </div>
  <div class="empty">新會員請點主辦給你的<b>專屬連結</b>，<br>就會直接進到自己的表單。</div>`;
}
function tryPin(){
  if($('pin').value.trim() === COORD_PIN){
    ADMIN = true; localStorage.setItem('bio_admin','1'); loadAdmin();
  } else alert('密碼錯誤');
}
function loadAdmin(){
  $('view').innerHTML = '<div class="empty">載入中…</div>';
  if(!SHARED){ $('view').innerHTML='<div class="empty">連線失敗，請重新整理。</div>'; return; }
  firebase.database().ref(NODE).on('value', s=>{ ALL = s.val() || {}; renderAdmin(); });
  firebase.database().ref(TRACKER+'/newMembers').once('value').then(s=>{
    window.__tracker = s.val() || []; renderAdmin();
  }).catch(()=>{});
}
function renderAdmin(){
  if(ALL === null) return;
  const base = location.origin + location.pathname;
  const rows = Object.entries(ALL).map(([k,v])=>{
    const d = v.data || {};
    const {n,total} = filledCount(d);
    const pct = Math.round(n/total*100);
    const cls = pct===100 ? 'ok' : (pct>0 ? 'mid' : 'no');
    const url = base + '?m=' + k;
    const upd = v.updatedAt ? new Date(v.updatedAt).toLocaleString('zh-TW',{hour12:false}) : '—';
    return `<div class="card">
      <div class="nm">${esc(v.name || d.name || '（未填姓名）')}
        <span class="pill ${cls}">${pct}%</span></div>
      <div class="meta">${esc(d.industry||d.rep||'')}　·　最後更新 ${esc(upd)}</div>
      <input class="linkbox" readonly value="${esc(url)}" onclick="this.select()">
      <div class="btnrow" style="margin-top:9px">
        <button class="btn" style="flex:1" onclick="copyTxt(this,'${url}')">複製連結</button>
        <button class="btn" style="flex:1" onclick="location.href='${url}'">開啟填寫</button>
      </div></div>`;
  }).join('');
  const seed = (window.__tracker||[]).filter(m=>
    !Object.values(ALL).some(v=>(v.name||'')===m.name));
  const seedHTML = seed.length ? `<div class="card">
      <div class="nm" style="font-size:15px">➕ 從追蹤名單建立</div>
      <div class="meta" style="margin-bottom:10px">點一下就會幫他建立一份空白四加一表並產生專屬連結</div>
      <div class="btnrow">${seed.map(m=>
        `<button class="btn" data-n="${esc(m.name)}" onclick="createFor(this.dataset.n)">${esc(m.name)}</button>`).join('')}</div>
    </div>` : '';
  $('view').innerHTML =
    `<div class="note">把每個人的<b>專屬連結</b>私訊給他本人，他點開就能直接填、自動儲存。</div>` +
    seedHTML +
    (rows || `<div class="empty">還沒有任何四加一表。<br>可以從上面的追蹤名單建立。</div>`) +
    `<div class="card"><div class="nm" style="font-size:15px">➕ 手動新增</div>
      <input type="text" id="newName" class="linkbox" style="color:#fff;font-size:16px;padding:12px;margin-top:9px"
        placeholder="輸入姓名">
      <button class="btn wide" style="margin-top:9px" onclick="createFor($('newName').value)">建立</button></div>`;
}
function createFor(name){
  name = (name||'').trim();
  if(!name){ alert('請輸入姓名'); return; }
  if(!SHARED){ alert('雲端未連線，請重新整理後再試。'); return; }
  try{
    const k = newKey();
    firebase.database().ref(NODE+'/'+k).set({
      name, data:{ name }, createdAt:Date.now(), updatedAt:Date.now(), updatedBy:'導師/幹部'
    }).then(()=>{
      const el = $('newName'); if(el) el.value='';
    }).catch(e=>alert('建立失敗：'+(e.message||e)));
  }catch(e){ alert('建立失敗：'+(e.message||e)); }
}
function copyTxt(btn, txt){
  navigator.clipboard.writeText(txt).then(()=>{
    const o = btn.textContent; btn.textContent = '已複製 ✓';
    setTimeout(()=>btn.textContent = o, 1500);
  });
}

/* ═══════════════ 啟動 ═══════════════ */
initSync();
if(MKEY){
  $('view').innerHTML = '<div class="empty">載入中…</div>';
  setTimeout(()=>{ if(!META.createdAt && !Object.keys(DATA).length) renderForm(); }, 2500);
} else if(ADMIN){
  loadAdmin();
} else {
  renderAdminGate();
}
</script>
